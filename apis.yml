aid: abre
name: Abre
image: https://abre.com/wp-content/uploads/2021/09/abre_logo_light.svg
description: >-
  Abre is a K-12 education data platform, founded in 2017 in Cincinnati, Ohio, that consolidates
  student, staff and operational data from a district's student information system and its EdTech
  tools into a single interface built around a Student360 learner profile. The platform ships as a
  set of role-based apps — Analytics and Insight dashboards, Assessment, Health & Wellness, MTSS &
  Intervention, Student Success & ePortfolio, Staff Development, Communication & Engagement,
  Curriculum, Learn and Focus — plus a marketplace of shareable dashboard packs, plans, forms,
  courses and surveys. Abre is sold to districts as a managed Data-as-a-Service engagement rather
  than as a developer product: it is a heavy CONSUMER of other people's APIs and publishes none of
  its own. Districts feed Abre through five documented rostering paths — an automated SIS
  integration over SFTP, SchoolDay (GG4L) School Passport, ClassLink OneRoster, OneRoster ZIP files
  dropped on SFTP, and a native 1EdTech OneRoster 1.1 REST API sync authenticated with OAuth 2.0 —
  and sign in through OAuth 2.0 SSO with Google, Microsoft, Apple, ClassLink, Clever, GG4L or
  Facebook. As of this profiling pass Abre publishes no developer portal, no API reference, no
  OpenAPI or other machine-readable contract, no SDKs and no public MCP or agent surface; its
  public technical surface is a Zendesk help center of integration guides for the APIs it ingests.
